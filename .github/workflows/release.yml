name: Release

# Push a tag like v0.2.0 (matching versionName) to build a signed APK and publish it as a GitHub
# release. Installed copies pick it up through the in-app updater. See README › Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
      - name: Restore signing key
        env:
          NIF_KEYSTORE_BASE64: ${{ secrets.NIF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NIF_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NIF_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$NIF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NIF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release
        env:
          NIF_KEYSTORE_PASSWORD: ${{ secrets.NIF_KEYSTORE_PASSWORD }}
          NIF_KEY_ALIAS: ${{ secrets.NIF_KEY_ALIAS }}
          NIF_KEY_PASSWORD: ${{ secrets.NIF_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "nothing-is-free-$GITHUB_REF_NAME.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="nothing-is-free-$GITHUB_REF_NAME.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
          fi
