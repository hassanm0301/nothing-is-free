name: Release

# Builds a signed APK and publishes it as a GitHub release, started any of these ways (README ›
# Releases):
# - Push to develop, i.e. every merge into it: publishes develop's versionName, a preview such as
#   0.7.0-beta.1, as a pre-release. Fails if that tag is taken (bump versionCode and the preview
#   number in the merge). A full versionName on develop, the hand-off to main, publishes nothing.
# - Run workflow (Actions tab or API) on main for a full release, or on develop for a preview:
#   tags the commit it builds v<versionName>, then publishes.
# - Push a tag like v0.2.0, matching versionName.
# Claude Code cloud sessions cannot push tags, so they release by pushing develop or running this.
# A version with a suffix, like 0.6.0-beta.1, is published as a pre-release, which only copies
# with Beta updates on are offered. Installed copies pick it up through the in-app updater.
on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two runs cannot both find the tag free.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which tag to publish, or none.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          tag="v$version"
          case "$GITHUB_REF" in
            refs/tags/*)
              if [ "$tag" != "$GITHUB_REF_NAME" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
                exit 1
              fi
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            refs/heads/develop)
              case "$version" in
                *-*) ;;
                *)
                  if [ "$GITHUB_EVENT_NAME" = push ]; then
                    echo "::notice::$version is a full release: merge develop into $DEFAULT_BRANCH and run this workflow there"
                    exit 0
                  fi
                  echo "::error::develop publishes previews only; give it a versionName like $version-beta.1"
                  exit 1
                  ;;
              esac
              ;;
            "refs/heads/$DEFAULT_BRANCH") ;;
            *)
              echo "::error::Run this workflow on $DEFAULT_BRANCH or develop, not $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          case $status in
            0) echo "::error::$tag already exists; bump versionCode and versionName first"; exit 1 ;;
            2) ;; # no such tag
            *) echo "::error::Could not check whether $tag exists"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Restore signing key
        env:
          NIF_KEYSTORE_BASE64: ${{ secrets.NIF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NIF_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NIF_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$NIF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NIF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release
        env:
          NIF_KEYSTORE_PASSWORD: ${{ secrets.NIF_KEYSTORE_PASSWORD }}
          NIF_KEY_ALIAS: ${{ secrets.NIF_KEY_ALIAS }}
          NIF_KEY_PASSWORD: ${{ secrets.NIF_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "nothing-is-free-$TAG.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="nothing-is-free-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            # On a manual run the tag does not exist yet: --target creates it on the commit just
            # built. (A tag made with this token does not start the push trigger again.)
            gh release create "$TAG" "$apk" --title "$TAG" --generate-notes --target "$GITHUB_SHA" "${prerelease[@]}"
          fi
